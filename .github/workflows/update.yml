name: Update sharp tracker

# Runs only on demand: the site's Refresh button (via the Cloudflare Worker),
# or "Run workflow" on the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write # commit docs/data.json when bets change
  pages: write # publish the site
  id-token: write # required by deploy-pages

# One run at a time; a run that arrives while one is going waits its turn.
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull sharp data and grade bets
        env:
          AN_TOKEN: ${{ secrets.AN_TOKEN }}
        run: python3 update.py

      # Commit only when bets changed, not when just the "updated" time moved,
      # so the repo history doesn't grow every 5 minutes.
      - name: Commit changed bets
        run: |
          git config user.name "sharp-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet -I '^\{"updated":'; then
            echo "No bet changes"
            git reset -q docs/data.json
          else
            git commit -m "Update sharp data $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase -q || true
            git push
          fi

      # Publish docs/ as it is now, including the fresh "updated" time.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
