name: Update sharp tracker

# Runs on demand only: the site's Refresh button (via the Cloudflare Worker),
# or "Run workflow" on the Actions tab. Telegram alerts come from the Worker itself.
on:
  workflow_dispatch:

permissions:
  contents: write # commit docs/data.json when bets change
  pages: write # publish the site
  id-token: write # required by deploy-pages

# One run at a time; a run that arrives while one is going waits its turn.
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Pull sharp data and grade bets
        env:
          AN_TOKEN: ${{ secrets.AN_TOKEN }}
        run: python3 update.py

      # Commit only when bets changed, not when just the "updated" time moved,
      # so the repo history stays small.
      - name: Commit changed bets
        run: |
          git config user.name "sharp-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet -I '^\{"updated":'; then
            echo "No bet changes"
            git reset -q docs/data.json
          else
            git commit -m "Update sharp data $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase -q || true
            git push
          fi

      # Publish docs/ as it is now, including the fresh "updated" time.
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      # GitHub sometimes can't find the just-uploaded site files for a few seconds
      # ("No artifacts named github-pages were found"), so retry the publish twice.
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait, then retry the publish
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait longer, then try once more
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60
      - id: deploy3
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
