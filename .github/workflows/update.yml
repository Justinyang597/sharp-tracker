name: Update sharp tracker

on:
  schedule:
    - cron: "17 * * * *" # every hour at :17 (GitHub may start it a few minutes late)
  workflow_dispatch: # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull sharp data and grade bets
        env:
          AN_TOKEN: ${{ secrets.AN_TOKEN }}
        run: python update.py

      - name: Commit updated data
        run: |
          git config user.name "sharp-tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update sharp data $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
